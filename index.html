
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURAMA KEY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at top,#260609,#080808 65%);
  color:white;font-family:Arial,sans-serif;
  padding:20px
}
.card{
  width:100%;max-width:430px;text-align:center;
  background:#0c0c0f;border:1px solid #6e1018;
  border-radius:18px;padding:30px 22px;
  box-shadow:0 0 30px #ff001522
}
h1{font-size:30px;letter-spacing:3px;margin:8px 0}
h1 span{color:#ff2038}
.subtitle{color:#999;font-size:11px;letter-spacing:3px;margin-bottom:35px}
button{
  width:100%;padding:17px 10px;border:1px solid #ff5262;
  border-radius:10px;background:linear-gradient(135deg,#b90017,#ff233a);
  color:white;font-size:17px;font-weight:bold;letter-spacing:1px;
  cursor:pointer;box-shadow:0 0 18px #ff001533
}
button:disabled{opacity:.6}
.progress-info{display:flex;justify-content:space-between;
  color:#aaa;font-size:12px;margin:25px 0 8px}
.track{height:12px;background:#222;border-radius:20px;overflow:hidden;
  border:1px solid #512027}
.bar{height:100%;width:0;background:#ff2038;
  box-shadow:0 0 12px #ff2038;transition:width .08s linear}
.result{display:none;margin-top:28px;padding:18px 10px;
  border:1px solid #6e1018;border-radius:12px;background:#12090b}
.result p{font-size:11px;color:#aaa;letter-spacing:2px}
.key{font-size:21px;font-weight:bold;color:#ff4053;
  overflow-wrap:anywhere;margin:18px 0}
.copy{background:#171719;border-color:#444;font-size:14px}
.status{font-size:12px;color:#888;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <h1>KURAMA <span>KEY</span></h1>
  <div class="subtitle">KEY GENERATOR SYSTEM</div>

  <button id="generate" onclick="generateKey()">
    ⚙ GENERATE KEY
  </button>

  <div class="progress-info">
    <span id="status">READY TO GENERATE</span>
    <span id="percent">0%</span>
  </div>
  <div class="track">
    <div class="bar" id="bar"></div>
  </div>

  <div class="result" id="result">
    <p>✓ YOUR KEY IS READY</p>
    <div class="key" id="key">KURAMA-20SAFE</div>
    <button class="copy" onclick="copyKey()">COPY KEY</button>
  </div>

  <div class="status">KURAMA SYSTEM • V1.0</div>
</div>

<script>
let running = false;

function generateKey(){
  if(running) return;
  running = true;

  const btn = document.getElementById("generate");
  const bar = document.getElementById("bar");
  const percent = document.getElementById("percent");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  btn.disabled = true;
  result.style.display = "none";

  let progress = 0;
  status.textContent = "GENERATING KEY...";

  const timer = setInterval(() => {
    progress++;
    bar.style.width = progress + "%";
    percent.textContent = progress + "%";

    if(progress >= 100){
      clearInterval(timer);
      status.textContent = "GENERATION COMPLETE";
      result.style.display = "block";
      btn.textContent = "✓ KEY GENERATED";
      running = false;
    }
  }, 35);
}

function copyKey(){
  const key = document.getElementById("key").textContent;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(key).then(() => {
      alert("KEY COPIED: " + key);
    }).catch(() => fallbackCopy(key));
  } else {
    fallbackCopy(key);
  }
}

function fallbackCopy(key){
  const area = document.createElement("textarea");
  area.value = key;
  document.body.appendChild(area);
  area.select();
  document.execCommand("copy");
  area.remove();
  alert("KEY: " + key);
}
</script>
</body>
</html>
